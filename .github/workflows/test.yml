name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # L'action insere cette valeur telle quelle dans du code R. `all`
          # est le selecteur pak valide pour Depends, Imports et Suggests.
          dependencies: '"all"'
      - name: Test package
        run: Rscript -e 'testthat::test_local(stop_on_failure = TRUE)'
