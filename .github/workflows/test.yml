name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # L'action insere cette valeur telle quelle dans du code R : il faut
          # une chaine R (et non le booleen YAML `true`).
          dependencies: '"true"'
      - name: Test package
        run: Rscript -e 'devtools::test(stop_on_failure = TRUE)'
